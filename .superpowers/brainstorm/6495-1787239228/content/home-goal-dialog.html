<style>
  .question-stage {
    min-height: calc(100vh - 106px);
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .question-dialog {
    width: min(100%, 620px);
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--bg-secondary);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.16);
  }

  .question-kicker {
    margin-bottom: 10px;
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 650;
    letter-spacing: 0.08em;
  }

  .question-dialog h2 {
    max-width: 18em;
    margin-bottom: 8px;
    line-height: 1.24;
  }

  .question-dialog .subtitle { margin-bottom: 20px; }

  .question-dialog .option { padding: 14px 16px; }

  .question-dialog .option:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .question-note {
    margin-top: 18px;
    color: var(--text-tertiary);
    font-size: 0.78rem;
  }

  @media (max-width: 420px) {
    .question-stage { padding: 12px; }
    .question-dialog { padding: 20px; border-radius: 18px; }
  }
</style>

<main class="question-stage">
  <section class="question-dialog" role="dialog" aria-modal="true" aria-labelledby="home-goal-title">
    <p class="question-kicker">首页设计问答 · 1 / 3</p>
    <h2 id="home-goal-title">用户打开首页的前 10 秒，最重要的是哪件事？</h2>
    <p class="subtitle">请选择最优先的一项；我会据此收敛三套首页的阅读节奏。</p>

    <div class="options" role="radiogroup" aria-label="首页核心目标">
      <button class="option" type="button" data-choice="a" onclick="toggleSelect(this)" role="radio" aria-checked="false">
        <span class="letter">A</span>
        <span class="content"><h3>立即读进一篇内容</h3><p>把当天最值得读的文章明确推到第一位。</p></span>
      </button>
      <button class="option" type="button" data-choice="b" onclick="toggleSelect(this)" role="radio" aria-checked="false">
        <span class="letter">B</span>
        <span class="content"><h3>快速掌握今日全貌</h3><p>高效扫读，快速判断哪些题目值得进入。</p></span>
      </button>
      <button class="option" type="button" data-choice="c" onclick="toggleSelect(this)" role="radio" aria-checked="false">
        <span class="letter">C</span>
        <span class="content"><h3>按兴趣发现内容</h3><p>先看到我关心的主题，再决定从哪篇读起。</p></span>
      </button>
      <button class="option" type="button" data-choice="d" onclick="toggleSelect(this)" role="radio" aria-checked="false">
        <span class="letter">D</span>
        <span class="content"><h3>其他目标</h3><p>请在对话里告诉我，你希望首页优先完成什么。</p></span>
      </button>
    </div>

    <p class="question-note">点击选项会记录选择；也可以直接在对话中回复 A、B、C 或 D。</p>
  </section>
</main>
