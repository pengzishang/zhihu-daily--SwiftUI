name: 知乎日报-SwiftUI
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 2VU9VJU88T
targets:
  DailyReader:
    type: application
    platform: iOS
    sources:
      - path: DailyReader
        excludes:
          - Features/Settings/SettingsView.swift
    dependencies:
      - package: Alamofire
      - package: Kingfisher
      - package: LookinServer
    configFiles:
      Debug: Config/AIProviders.xcconfig
      Release: Config/AIProviders.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.DailyReader
        INFOPLIST_FILE: DailyReader/Resources/Info.plist
    info:
      path: DailyReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: 日报阅读器
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        AIBuiltInProviders: $(AI_BUILTIN_PROVIDERS_B64URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchBrandMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  DailyReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyReaderTests
    dependencies:
      - target: DailyReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.DailyReaderTests
        GENERATE_INFOPLIST_FILE: YES
  DailyReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DailyReaderUITests
    dependencies:
      - target: DailyReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.DailyReaderUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DailyReader:
    build:
      targets:
        DailyReader: all
    test:
      gatherCoverageData: true
      targets:
        - DailyReaderTests
        - DailyReaderUITests
    run:
      config: Debug

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  LookinServer:
    url: https://github.com/QMUI/LookinServer.git
    from: 1.2.8

